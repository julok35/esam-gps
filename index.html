<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPS ESAM</title>
<meta name="description" content="Convertisseur de coordonnées GPS de l'ESAM : photo, lecture du texte, carte, partage.">
<meta name="theme-color" content="#AFC8E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GPS ESAM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;700&family=Roboto+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="band">
  <div class="band-in">
    <img alt="Logo ESAM" src="logo.png" width="40" height="40">
    <h1>GPS ESAM</h1>
    <span class="net" id="net" hidden>Hors ligne</span>
  </div>
</header>

<main>
  <section class="block">
    <div class="row2">
      <label class="btn big" for="cam">Photographier</label>
      <label class="btn big sec" for="gal">Choisir une photo</label>
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="gal" type="file" accept="image/*" hidden>

    <div class="crop" id="cropBox" hidden>
      <span class="lbl">Encadrez les coordonnées au doigt</span>
      <div class="crop-stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="sel" id="sel"><span class="h tl"></span><span class="h tr"></span><span class="h bl"></span><span class="h br"></span></div>
      </div>
      <div class="row4">
        <button class="btn" type="button" id="ocrGo">Lire</button>
        <button class="btn sec" type="button" id="rot">Pivoter</button>
        <button class="btn sec" type="button" id="cropAll">Tout</button>
        <button class="btn sec" type="button" id="cropClose">Fermer</button>
      </div>
      <div class="prog" id="prog" hidden><div id="progBar"></div><span id="progTxt"></span></div>
    </div>

    <div class="srcwrap">
      <textarea id="src" aria-label="Texte reçu" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Ou collez le texte reçu (SMS, lien Maps...)"></textarea>
      <button class="clr" id="clear" type="button" aria-label="Effacer le texte">Effacer</button>
    </div>
  </section>

  <section class="result" id="result" aria-live="polite"></section>

  <section class="block" id="mapCard">
    <div class="maphead">
      <button class="chip" type="button" id="fitBoth">Les deux</button>
      <button class="chip" type="button" id="goTarget">Point</button>
      <button class="chip" type="button" id="goMe">Moi</button>
    </div>
    <div id="map" role="region" aria-label="Carte"></div>
    <div class="dist" id="dist">
      <div><span>Distance</span><b id="dD">-</b></div>
      <div><span>Cap</span><b id="dB">-</b></div>
      <div><span>Précision</span><b id="dA">-</b></div>
    </div>
    <p class="hint" id="geoMsg" hidden></p>
  </section>

  <details class="block fold" id="shareCard" hidden>
    <summary>Partager le point</summary>
    <div class="row3">
      <button class="btn" type="button" id="shareBtn">Partager</button>
      <button class="btn sec" type="button" id="qrBtn">QR code</button>
      <button class="btn sec" type="button" id="copyMsg">Copier message</button>
    </div>
    <div class="qr" id="qrBox" hidden>
      <div class="seg3" role="tablist">
        <button type="button" data-qr="app" class="on">Appli ESAM</button>
        <button type="button" data-qr="maps">Google Maps</button>
        <button type="button" data-qr="geo">geo:</button>
      </div>
      <div id="qrImg" class="qrimg"></div>
      <p class="hint" id="qrTxt"></p>
    </div>
  </details>

  <details class="block fold" id="eqCard" hidden>
    <summary>DMM, DMS, UTM</summary>
    <table class="eq"><tbody id="eq"></tbody></table>
  </details>

  <details class="block fold" id="histCard" hidden>
    <summary>Historique</summary>
    <ul class="hist" id="hist"></ul>
  </details>

  <details class="block fold">
    <summary>Hors ligne</summary>
    <button class="btn sec wide" type="button" id="prepOff">Préparer la lecture de photo sans réseau</button>
    <p class="hint" id="prepMsg">Une fois, avec du réseau (7 Mo). La carte hors ligne n'affiche que les zones déjà vues.</p>
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
